name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Go tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install golang.org/x/tools/cmd/goimports@v0.52.0
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run repository checks
        run: make check

      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code

      - name: Run race tests
        run: make test-race

      - name: Run end-to-end and deployment integration tests
        run: make test-e2e

      - name: Build
        run: make build

      - name: Clean build artifacts
        if: always()
        run: make clean
